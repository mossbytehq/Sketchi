name: Build artifacts

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
      sign_windows:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build; defaults to the selected branch
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  metadata:
    name: Read workspace version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
      - id: version
        name: Read version from Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo run --locked --package xtask -- version-check | sed -n 's/^Sketchi version //p' | tail -n 1)"
          test -n "$version" || {
            echo "Could not read the workspace version from Cargo.toml"
            exit 1
          }
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Build versions must have the form X.Y.Z or X.Y.Z-prerelease; got $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: ./.github/actions/install-linux-deps
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sketchi-release-${{ matrix.target }}
      - name: Build server
        run: cargo build --locked --release --target ${{ matrix.target }} --bin sketchi-server
      - name: Build Linux client
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export SKETCHI_EMBED_SERVER="$(pwd)/target/${{ matrix.target }}/release/sketchi-server"
          cargo build --locked --release --target ${{ matrix.target }} --bin sketchi
      - name: Build Windows standalone client
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export SKETCHI_EMBED_SERVER="$(pwd -W)/target/${{ matrix.target }}/release/sketchi-server.exe"
          cargo build --locked --release --target ${{ matrix.target }} --bin sketchi
      - name: Stage client package
        shell: bash
        run: cargo run --locked --package xtask -- package --target "${{ matrix.target }}" --format portable --target-dir target --out-dir dist/staging
      - name: Stage server package
        shell: bash
        run: cargo run --locked --package xtask -- package-server --target "${{ matrix.target }}" --target-dir target --out-dir dist/staging
      - name: Verify staged contents
        shell: bash
        run: |
          set -euo pipefail
          client_stage="$(find dist/staging -mindepth 1 -maxdepth 1 -type d -name "Sketchi-*-${{ matrix.target }}" ! -name "Sketchi-server-*" -print -quit)"
          server_stage="$(find dist/staging -mindepth 1 -maxdepth 1 -type d -name "Sketchi-server-*-${{ matrix.target }}" -print -quit)"
          test -n "$client_stage" || { echo "client staging directory was not created"; exit 1; }
          test -n "$server_stage" || { echo "server staging directory was not created"; exit 1; }
          staged_version="$(tr -d '\r\n' < "$client_stage/VERSION")"
          if [[ "$staged_version" != "${{ needs.metadata.outputs.version }}" ]]; then
            echo "metadata version ${{ needs.metadata.outputs.version }} does not match staged workspace version $staged_version"
            exit 1
          fi
          cargo run --locked --package xtask -- artifact-check --path "$client_stage" --target "${{ matrix.target }}" --kind client
          cargo run --locked --package xtask -- artifact-check --path "$server_stage" --target "${{ matrix.target }}" --kind server
          cargo run --locked --package xtask -- install-smoke --path "$client_stage" --target "${{ matrix.target }}" --kind client
          cargo run --locked --package xtask -- install-smoke --path "$server_stage" --target "${{ matrix.target }}" --kind server
      - name: Configure Windows signing
        id: configure_windows_signing
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGN_WINDOWS: ${{ inputs.sign_windows }}
        run: |
          $requested = $env:SIGN_WINDOWS -eq "true"
          $configured = $requested -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -and
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)

          if ($requested -and -not $configured) {
            Write-Warning "Windows signing was requested, but signing certificate secrets are not configured; continuing unsigned."
          }

          "enabled=$($configured.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Sign Windows binaries
        if: ${{ runner.os == 'Windows' && steps.configure_windows_signing.outputs.enabled == 'true' }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: https://timestamp.digicert.com
          SKETCHI_TARGET: ${{ matrix.target }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) {
            throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is not configured"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_SIGNING_CERTIFICATE_PASSWORD is not configured"
          }

          $pfx = Join-Path $env:RUNNER_TEMP "sketchi-signing.pfx"
          try {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
            [IO.File]::WriteAllBytes($pfx, $bytes)
          } catch {
            throw "The Windows signing certificate is not valid base64: $($_.Exception.Message)"
          }

          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            throw "signtool.exe was not found on the Windows runner"
          }

          $stage = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\staging" -Directory |
            Where-Object { $_.Name -like "Sketchi-*-$env:SKETCHI_TARGET" -and $_.Name -notlike "Sketchi-server-*" } |
            Select-Object -First 1
          $serverStage = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\staging" -Directory |
            Where-Object { $_.Name -like "Sketchi-server-*-$env:SKETCHI_TARGET" } |
            Select-Object -First 1
          if ($null -eq $stage -or $null -eq $serverStage) {
            throw "Windows staging directories were not found"
          }

          $files = @(
            (Join-Path $stage.FullName "Sketchi.exe"),
            (Join-Path $stage.FullName "Sketchi-server.exe"),
            (Join-Path $serverStage.FullName "Sketchi-server.exe")
          ) | Select-Object -Unique
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Cannot sign missing file $file"
            }
            & $signtool sign /fd SHA256 /tr $env:WINDOWS_SIGNING_TIMESTAMP_URL /td SHA256 /f $pfx /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $file
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed to sign $file with exit code $LASTEXITCODE"
            }
            & $signtool verify /pa /all $file
            if ($LASTEXITCODE -ne 0) {
              throw "signtool could not verify the signature on $file"
            }
          }
      - name: Build Windows MSI installer
        if: ${{ runner.os == 'Windows' && !contains(needs.metadata.outputs.version, '-') }}
        shell: pwsh
        env:
          SKETCHI_VERSION: ${{ needs.metadata.outputs.version }}
          SKETCHI_TARGET: ${{ matrix.target }}
          WIX_VERSION: 5.0.2
        run: |
          $stage = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\staging" -Directory |
            Where-Object { $_.Name -like "Sketchi-*-$env:SKETCHI_TARGET" -and $_.Name -notlike "Sketchi-server-*" } |
            Select-Object -First 1
          if ($null -eq $stage) {
            throw "Windows client staging directory was not found"
          }

          $wixDir = Join-Path $env:RUNNER_TEMP "wix"
          dotnet tool install --tool-path $wixDir wix --version $env:WIX_VERSION
          $wix = Join-Path $wixDir "wix.exe"
          & $wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $installer = Join-Path $env:GITHUB_WORKSPACE "dist\staging\Sketchi-$env:SKETCHI_VERSION-windows-x86_64-setup.msi"
          & $wix build "$env:GITHUB_WORKSPACE\packaging\windows\main.wxs" `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -d "Version=$env:SKETCHI_VERSION" `
            -d "ClientBinary=$($stage.FullName)\Sketchi.exe" `
            -d "ServerBinary=$($stage.FullName)\Sketchi-server.exe" `
            -d "LicenseFile=$($stage.FullName)\LICENSE.md" `
            -d "IconFile=$($stage.FullName)\Sketchi.ico" `
            "-bindvariable" `
            "WixUILicenseRtf=$env:GITHUB_WORKSPACE\packaging\windows\license.rtf" `
            -o $installer
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path $installer)) {
            throw "WiX did not create $installer"
          }
      - name: Sign Windows MSI installer
        if: ${{ runner.os == 'Windows' && steps.configure_windows_signing.outputs.enabled == 'true' && !contains(needs.metadata.outputs.version, '-') }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: https://timestamp.digicert.com
          SKETCHI_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sketchi-signing.pfx"
          if (-not (Test-Path $pfx)) {
            throw "The Windows signing certificate was not created"
          }
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            throw "signtool.exe was not found on the Windows runner"
          }
          $installer = Join-Path $env:GITHUB_WORKSPACE "dist\staging\Sketchi-$env:SKETCHI_VERSION-windows-x86_64-setup.msi"
          & $signtool sign /fd SHA256 /tr $env:WINDOWS_SIGNING_TIMESTAMP_URL /td SHA256 /f $pfx /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $installer
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to sign the MSI with exit code $LASTEXITCODE"
          }
          & $signtool verify /pa /all $installer
          if ($LASTEXITCODE -ne 0) {
            throw "signtool could not verify the MSI signature"
          }
      - name: Build Windows setup executable
        if: ${{ runner.os == 'Windows' && !contains(needs.metadata.outputs.version, '-') }}
        shell: pwsh
        env:
          SKETCHI_VERSION: ${{ needs.metadata.outputs.version }}
          SKETCHI_TARGET: ${{ matrix.target }}
          WIX_VERSION: 5.0.2
        run: |
          $stage = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\staging" -Directory |
            Where-Object { $_.Name -like "Sketchi-*-$env:SKETCHI_TARGET" -and $_.Name -notlike "Sketchi-server-*" } |
            Select-Object -First 1
          if ($null -eq $stage) {
            throw "Windows client staging directory was not found"
          }
          $msi = Join-Path $env:GITHUB_WORKSPACE "dist\staging\Sketchi-$env:SKETCHI_VERSION-windows-x86_64-setup.msi"
          if (-not (Test-Path $msi)) {
            throw "Windows MSI installer was not found"
          }

          $wixDir = Join-Path $env:RUNNER_TEMP "wix"
          $wix = Join-Path $wixDir "wix.exe"
          & $wix extension add -g "WixToolset.BootstrapperApplications.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $setup = Join-Path $env:GITHUB_WORKSPACE "dist\staging\Sketchi-$env:SKETCHI_VERSION-windows-x86_64-setup.exe"
          & $wix build "$env:GITHUB_WORKSPACE\packaging\windows\bundle.wxs" `
            -arch x64 `
            -ext WixToolset.BootstrapperApplications.wixext `
            -d "Version=$env:SKETCHI_VERSION" `
            -d "IconFile=$($stage.FullName)\Sketchi.ico" `
            -d "LicenseRtf=$env:GITHUB_WORKSPACE\packaging\windows\license.rtf" `
            -d "MsiFile=$msi" `
            -o $setup
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path $setup)) {
            throw "WiX did not create $setup"
          }
      - name: Sign Windows setup executable
        if: ${{ runner.os == 'Windows' && steps.configure_windows_signing.outputs.enabled == 'true' && !contains(needs.metadata.outputs.version, '-') }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: https://timestamp.digicert.com
          SKETCHI_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sketchi-signing.pfx"
          $setup = Join-Path $env:GITHUB_WORKSPACE "dist\staging\Sketchi-$env:SKETCHI_VERSION-windows-x86_64-setup.exe"
          $engine = Join-Path $env:RUNNER_TEMP "sketchi-burn-engine.exe"
          $signedSetup = Join-Path $env:RUNNER_TEMP "sketchi-setup-signed.exe"
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            throw "signtool.exe was not found on the Windows runner"
          }
          $wix = Join-Path $env:RUNNER_TEMP "wix\wix.exe"
          & $wix burn detach $setup -engine $engine
          if ($LASTEXITCODE -ne 0) {
            throw "WiX could not detach the Burn engine"
          }
          & $signtool sign /fd SHA256 /tr $env:WINDOWS_SIGNING_TIMESTAMP_URL /td SHA256 /f $pfx /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $engine
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to sign the Burn engine"
          }
          & $wix burn reattach $setup -engine $engine -o $signedSetup
          if ($LASTEXITCODE -ne 0) {
            throw "WiX could not reattach the signed Burn engine"
          }
          Move-Item -Force $signedSetup $setup
          & $signtool sign /fd SHA256 /tr $env:WINDOWS_SIGNING_TIMESTAMP_URL /td SHA256 /f $pfx /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $setup
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to sign the Windows setup executable"
          }
          & $signtool verify /pa /all $setup
          if ($LASTEXITCODE -ne 0) {
            throw "signtool could not verify the setup executable signature"
          }
      - name: Smoke-test Windows MSI installer
        if: ${{ runner.os == 'Windows' && !contains(needs.metadata.outputs.version, '-') }}
        shell: pwsh
        env:
          SKETCHI_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $installer = "$env:GITHUB_WORKSPACE\dist\staging\Sketchi-$env:SKETCHI_VERSION-windows-x86_64-setup.msi"
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", $installer, "/qn", "/norestart"
          )
          if ($install.ExitCode -ne 0) {
            throw "MSI installation failed with exit code $($install.ExitCode)"
          }

          $installDir = Join-Path ${env:ProgramFiles} "Sketchi"
          $client = Join-Path $installDir "Sketchi.exe"
          $server = Join-Path $installDir "Sketchi-server.exe"
          if (-not (Test-Path $client) -or -not (Test-Path $server)) {
            throw "Installed Sketchi files were not found in $installDir"
          }
          & $server --check-config --insecure-loopback
          if ($LASTEXITCODE -ne 0) {
            throw "Installed Sketchi server smoke check failed"
          }

          $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/x", $installer, "/qn", "/norestart"
          )
          if ($uninstall.ExitCode -ne 0) {
            throw "MSI uninstall failed with exit code $($uninstall.ExitCode)"
          }
      - name: Smoke-test Windows setup executable
        if: ${{ runner.os == 'Windows' && !contains(needs.metadata.outputs.version, '-') }}
        shell: pwsh
        env:
          SKETCHI_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $setup = "$env:GITHUB_WORKSPACE\dist\staging\Sketchi-$env:SKETCHI_VERSION-windows-x86_64-setup.exe"
          $install = Start-Process $setup -Wait -PassThru -ArgumentList @(
            "/quiet", "/norestart"
          )
          if ($install.ExitCode -ne 0) {
            throw "Windows setup installation failed with exit code $($install.ExitCode)"
          }
          $installDir = Join-Path ${env:ProgramFiles} "Sketchi"
          $client = Join-Path $installDir "Sketchi.exe"
          $server = Join-Path $installDir "Sketchi-server.exe"
          if (-not (Test-Path $client) -or -not (Test-Path $server)) {
            throw "Setup did not install Sketchi files in $installDir"
          }
          & $server --check-config --insecure-loopback
          if ($LASTEXITCODE -ne 0) {
            throw "Installed Sketchi server smoke check failed"
          }
          $uninstall = Start-Process $setup -Wait -PassThru -ArgumentList @(
            "/uninstall", "/quiet", "/norestart"
          )
          if ($uninstall.ExitCode -ne 0) {
            throw "Windows setup uninstall failed with exit code $($uninstall.ExitCode)"
          }
      - name: Remove Windows signing certificate
        if: ${{ always() && runner.os == 'Windows' && inputs.sign_windows }}
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\sketchi-signing.pfx"
      - uses: actions/upload-artifact@v4
        with:
          name: sketchi-staging-${{ matrix.target }}
          path: dist/staging
          if-no-files-found: error

  arch-package:
    name: Arch package
    needs: [metadata, build]
    if: ${{ !contains(needs.metadata.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: sketchi-staging-x86_64-unknown-linux-gnu
          path: dist/staging
      - name: Build Arch package
        shell: bash
        run: |
          set -euo pipefail
          stage="$(find dist/staging -mindepth 1 -maxdepth 1 -type d -name 'Sketchi-*-x86_64-unknown-linux-gnu' ! -name 'Sketchi-server-*' -print -quit)"
          test -n "$stage" || { echo "client staging directory was not downloaded"; exit 1; }
          stage="$(realpath "$stage")"
          export SKETCHI_VERSION="$(tr -d '\r\n' < "$stage/VERSION")"
          export SKETCHI_STAGE_NAME="$(basename "$stage")"
          if [[ "$SKETCHI_VERSION" != "${{ needs.metadata.outputs.version }}" ]]; then
            echo "metadata version ${{ needs.metadata.outputs.version }} does not match staged workspace version $SKETCHI_VERSION"
            exit 1
          fi
          mkdir -p dist/artifacts dist/arch-build
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --env SKETCHI_VERSION \
            --env SKETCHI_STAGE_NAME \
            archlinux:base \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel
              useradd --create-home builder
              chown -R builder:builder /workspace/dist /workspace/packaging/arch
              su builder -s /bin/bash -c "
                export SKETCHI_VERSION=${SKETCHI_VERSION}
                export SKETCHI_STAGE_DIR=/workspace/dist/staging/${SKETCHI_STAGE_NAME}
                export PKGDEST=/workspace/dist/artifacts
                export BUILDDIR=/workspace/dist/arch-build
                makepkg --cleanbuild --force --nodeps --skipinteg \
                  -D packaging/arch -p PKGBUILD
                package=\$(find /workspace/dist/artifacts -maxdepth 1 -type f \
                  -name \"sketchi-${SKETCHI_VERSION}-*.pkg.tar.*\" \
                  ! -name \"*-debug-*\" -print -quit)
                test -n \"\$package\"
                pacman -Qp \"\$package\"
                tar --zstd -tf \"\$package\" | grep -Fx usr/bin/sketchi
                tar --zstd -tf \"\$package\" | grep -Fx usr/bin/sketchi-server
                tar --zstd -tf \"\$package\" | grep -Fx usr/share/applications/sketchi.desktop
                rm -f /workspace/dist/artifacts/*-debug-*.pkg.tar.*
              "
            '
      - uses: actions/upload-artifact@v4
        with:
          name: sketchi-package-arch-${{ needs.metadata.outputs.version }}
          path: dist/artifacts
          if-no-files-found: error

  deb-package:
    name: Debian package
    needs: [metadata, build]
    if: ${{ !contains(needs.metadata.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: sketchi-staging-x86_64-unknown-linux-gnu
          path: dist/staging
      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          stage="$(find dist/staging -mindepth 1 -maxdepth 1 -type d -name 'Sketchi-*-x86_64-unknown-linux-gnu' ! -name 'Sketchi-server-*' -print -quit)"
          test -n "$stage" || { echo "client staging directory was not downloaded"; exit 1; }
          stage="$(realpath "$stage")"
          export SKETCHI_VERSION="$(tr -d '\r\n' < "$stage/VERSION")"
          if [[ "$SKETCHI_VERSION" != "${{ needs.metadata.outputs.version }}" ]]; then
            echo "metadata version ${{ needs.metadata.outputs.version }} does not match staged workspace version $SKETCHI_VERSION"
            exit 1
          fi
          package_root="$PWD/dist/deb/sketchi"
          mkdir -p "$package_root/DEBIAN" "$PWD/dist/artifacts"
          sed "s/\${SKETCHI_VERSION}/$SKETCHI_VERSION/" packaging/deb/control > "$package_root/DEBIAN/control"
          install -Dm755 "$stage/Sketchi" "$package_root/usr/bin/sketchi"
          install -Dm755 "$stage/Sketchi-server" "$package_root/usr/bin/sketchi-server"
          install -Dm644 "$stage/LICENSE.md" "$package_root/usr/share/doc/sketchi/LICENSE.md"
          install -Dm644 "$stage/VERSION" "$package_root/usr/share/sketchi/VERSION"
          install -Dm644 "$stage/share/applications/sketchi.desktop" \
            "$package_root/usr/share/applications/sketchi.desktop"
          install -Dm644 "$stage/share/icons/hicolor/512x512/apps/sketchi.png" \
            "$package_root/usr/share/icons/hicolor/512x512/apps/sketchi.png"
          dpkg-deb --build --root-owner-group "$package_root" \
            "dist/artifacts/sketchi_${SKETCHI_VERSION}_amd64.deb"
          dpkg-deb --info "dist/artifacts/sketchi_${SKETCHI_VERSION}_amd64.deb"
          dpkg-deb --contents "dist/artifacts/sketchi_${SKETCHI_VERSION}_amd64.deb" \
            | grep -F './usr/bin/sketchi'
      - uses: actions/upload-artifact@v4
        with:
          name: sketchi-package-deb-${{ needs.metadata.outputs.version }}
          path: dist/artifacts
          if-no-files-found: error

  rpm-package:
    name: RPM package
    needs: [metadata, build]
    if: ${{ !contains(needs.metadata.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: sketchi-staging-x86_64-unknown-linux-gnu
          path: dist/staging
      - name: Install RPM tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm
      - name: Build RPM package
        shell: bash
        run: |
          set -euo pipefail
          stage="$(find dist/staging -mindepth 1 -maxdepth 1 -type d -name 'Sketchi-*-x86_64-unknown-linux-gnu' ! -name 'Sketchi-server-*' -print -quit)"
          test -n "$stage" || { echo "client staging directory was not downloaded"; exit 1; }
          stage="$(realpath "$stage")"
          export SKETCHI_VERSION="$(tr -d '\r\n' < "$stage/VERSION")"
          if [[ "$SKETCHI_VERSION" != "${{ needs.metadata.outputs.version }}" ]]; then
            echo "metadata version ${{ needs.metadata.outputs.version }} does not match staged workspace version $SKETCHI_VERSION"
            exit 1
          fi
          rpm_top="$PWD/dist/rpmbuild"
          mkdir -p "$PWD/dist/artifacts" "$rpm_top"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bb \
            --define "_topdir $rpm_top" \
            --define "_sketchi_version $SKETCHI_VERSION" \
            --define "_sketchi_stage $stage" \
            packaging/rpm/sketchi.spec
          mapfile -t packages < <(find "$rpm_top/RPMS" -type f -name '*.rpm' -print)
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" dist/artifacts/
          rpm -qpl "dist/artifacts/$(basename "${packages[0]}")" | grep -Fx /usr/bin/sketchi
          rpm -qpl "dist/artifacts/$(basename "${packages[0]}")" | grep -Fx /usr/bin/sketchi-server
          rpm -qpl "dist/artifacts/$(basename "${packages[0]}")" | grep -Fx /usr/share/applications/sketchi.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: sketchi-package-rpm-${{ needs.metadata.outputs.version }}
          path: dist/artifacts
          if-no-files-found: error
