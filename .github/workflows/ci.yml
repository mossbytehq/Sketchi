name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-linux-deps
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: 8.0.x
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sketchi-${{ matrix.target }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: Release build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Build Windows WinUI bootstrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "sketchi-bootstrapper-ci"
          dotnet publish "$env:GITHUB_WORKSPACE\packaging\windows\bootstrapper\Sketchi.Bootstrapper.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output $output
          if (-not (Test-Path (Join-Path $output "Sketchi.Bootstrapper.exe"))) {
            throw "WinUI bootstrapper did not publish successfully"
          }
