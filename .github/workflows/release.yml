name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit containing the version in Cargo.toml
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Read workspace version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
      - id: version
        name: Read version from Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo run --locked --package xtask -- version-check | sed -n 's/^Sketchi version //p' | tail -n 1)"
          test -n "$version" || {
            echo "Could not read the workspace version from Cargo.toml"
            exit 1
          }
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release versions must have the form X.Y.Z or X.Y.Z-prerelease; got $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  assemble:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: sketchi-staging-*
          path: dist/staging
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: ${{ !contains(needs.version.outputs.version, '-') }}
        with:
          pattern: sketchi-package-*
          path: dist/artifacts
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Keep standalone runtime artifacts only
        run: mkdir -p dist/artifacts
      - name: Export Windows executable
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          windows_stage="$(find dist/staging -mindepth 1 -maxdepth 1 \
            -type d -name 'Sketchi-*-x86_64-pc-windows-msvc' \
            ! -name 'Sketchi-server-*' -print -quit)"
          test -n "$windows_stage" || {
            echo "Windows client staging directory was not downloaded"
            exit 1
          }
          install -m 0755 "$windows_stage/Sketchi.exe" \
            "dist/artifacts/Sketchi-${RELEASE_VERSION}-windows-x86_64.exe"
      - name: Export Linux executable
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          linux_stage="$(find dist/staging -mindepth 1 -maxdepth 1 \
            -type d -name 'Sketchi-*-x86_64-unknown-linux-gnu' \
            ! -name 'Sketchi-server-*' -print -quit)"
          test -n "$linux_stage" || {
            echo "Linux client staging directory was not downloaded"
            exit 1
          }
          install -m 0755 "$linux_stage/Sketchi" \
            "dist/artifacts/Sketchi-${RELEASE_VERSION}-linux-x86_64"
      - name: Generate checksums
        run: cargo run --locked --package xtask -- checksums --input-dir dist/artifacts --output dist/SHA256SUMS
      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            expected_assets="$(mktemp)"
            find dist/artifacts -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
              | sort > "$expected_assets"
            printf '%s\n' SHA256SUMS >> "$expected_assets"
            while IFS= read -r asset; do
              if ! grep -Fqx "$asset" "$expected_assets"; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              fi
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            rm -f "$expected_assets"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sketchi-release-${{ needs.version.outputs.version }}
          path: dist
          if-no-files-found: error
      - name: Create or reuse release tag
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            existing_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$existing_sha" != "$RELEASE_SHA" ]]; then
              echo "Tag $tag already points to $existing_sha, expected $RELEASE_SHA."
              echo "Bump the version in Cargo.toml, or repair this legacy tag once."
              exit 1
            fi
            echo "Reusing tag $tag"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$RELEASE_SHA" -m "Sketchi $tag"
            git push origin "$tag"
          fi
      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.version.outputs.sha }}
          draft: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist/artifacts/*
            dist/SHA256SUMS
