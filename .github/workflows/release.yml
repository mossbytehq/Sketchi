name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - id: version
        name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          cargo xtask version-check --tag "$RELEASE_TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.tag }}

  assemble:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: sketchi-staging-*
          path: dist/staging
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: sketchi-package-*
          path: dist/artifacts
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Keep standalone runtime artifacts only
        run: |
          mkdir -p dist/artifacts
      - name: Export Windows executables
        shell: bash
        run: |
          set -euo pipefail
          windows_stage="$(find dist/staging -mindepth 1 -maxdepth 1 \
            -type d -name 'Sketchi-*-x86_64-pc-windows-msvc' \
            ! -name 'Sketchi-server-*' -print -quit)"
          test -n "$windows_stage" || {
            echo "Windows client staging directory was not downloaded"
            exit 1
          }
          install -m 0755 "$windows_stage/Sketchi.exe" \
            "dist/artifacts/Sketchi.exe"
      - name: Export Linux executable
        shell: bash
        run: |
          set -euo pipefail
          linux_stage="$(find dist/staging -mindepth 1 -maxdepth 1 \
            -type d -name 'Sketchi-*-x86_64-unknown-linux-gnu' \
            ! -name 'Sketchi-server-*' -print -quit)"
          test -n "$linux_stage" || {
            echo "Linux client staging directory was not downloaded"
            exit 1
          }
          install -m 0755 "$linux_stage/Sketchi" "dist/artifacts/Sketchi"
      - name: Generate checksums
        run: cargo xtask checksums --input-dir dist/artifacts --output dist/SHA256SUMS
      - name: Remove obsolete Windows archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              case "$asset" in
                *x86_64-pc-windows-msvc.zip)
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                  ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sketchi-release-${{ needs.version.outputs.version }}
          path: dist
          if-no-files-found: error
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            dist/artifacts/*
            dist/SHA256SUMS
