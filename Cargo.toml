[workspace]
members = [
    "crates/canvas-core",
    "crates/canvas-protocol",
    "crates/canvas-renderer",
    "apps/canvas-client",
    "bin/canvas-server",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
axum = { version = "0.8.8", features = ["ws"] }
base64 = "0.22.1"
clap = { version = "4.5.48", features = ["derive"] }
directories = "6.0.0"
egui = "0.35.0"
egui-wgpu = "0.35.0"
egui-winit = {
    version = "0.35.0",
    default-features = false,
    features = ["clipboard", "links", "wayland", "x11"],
}
flate2 = "1.1.9"
futures-util = "0.3.33"
glam = { version = "0.30.8", features = ["serde"] }
hyper = "1.11.0"
hyper-util = { version = "0.1.20", features = ["server", "tokio", "http1", "http2"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
lyon = "1.0.16"
lucide-icons = "=1.33.0"
rand = "0.9.2"
rcgen = "0.14.5"
rfd = "0.16.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = "0.23.34"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
semver = "1.0.27"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tokio-rustls = "0.26.4"
tokio-tungstenite = { version = "0.28.0", features = ["__rustls-tls"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
wgpu = "29.0.4"
windows-sys = "0.61.2"
winit = {
    version = "0.30.12",
    default-features = false,
    features = [
        "rwh_06",
        "x11",
        "wayland",
        "wayland-dlopen",
        "wayland-csd-adwaita-crossfont",
    ],
}

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
pedantic = { level = "warn", priority = -1 }

[patch.crates-io]
# winit 0.30.13 exposes file drag-and-drop on X11, but its Wayland backend
# does not bind wl_data_device. Keep the native Wayland path and carry the
# small backend addition locally until upstream exposes the same events.
winit = { path = "vendor/winit" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
